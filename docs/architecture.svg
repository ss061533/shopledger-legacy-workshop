<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, four API routers, library modules, configuration, JSON data store, and order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="hotArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e4573d"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#13233a" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:750;letter-spacing:-.5px}.subtitle{font-size:15px;fill:#61738c}.laneTitle{font-size:16px;font-weight:700;letter-spacing:1.2px;fill:#50627c}.boxTitle{font-size:17px;font-weight:700}.small{font-size:13px;fill:#63748b}.tiny{font-size:12px;fill:#61738c}.tag{font-size:12px;font-weight:700;letter-spacing:.7px}.normal{fill:none;stroke:#8291a5;stroke-width:2;marker-end:url(#arrow)}.hot{fill:none;stroke:#e4573d;stroke-width:3.2;marker-end:url(#hotArrow)}.dashed{fill:none;stroke:#97a5b6;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#f5f7fb"/>
  <circle cx="1490" cy="80" r="150" fill="#e9eef7" opacity=".55"/><circle cx="72" cy="1000" r="190" fill="#eaf3f1" opacity=".55"/>
  <text x="70" y="76" class="title">ShopLedger · application architecture</text>
  <text x="72" y="108" class="subtitle">Browser POS and back office · Express API · JSON-file persistence</text>

  <rect x="60" y="145" width="1480" height="175" rx="18" fill="#fff" stroke="#d9e1ec"/>
  <text x="84" y="178" class="laneTitle">BROWSER UI</text>
  <g filter="url(#shadow)">
    <rect x="90" y="199" width="350" height="88" rx="12" fill="#edf4ff" stroke="#c8d9f2"/>
    <rect x="490" y="199" width="950" height="88" rx="12" fill="#f7f9fc" stroke="#d9e1ec"/>
  </g>
  <text x="116" y="234" class="boxTitle">public/index.html</text><text x="116" y="260" class="small">POS · Order History · Khata · Audit</text>
  <text x="516" y="234" class="boxTitle">public/js/app.js</text><text x="516" y="260" class="small">Catalog and cart preview · order submission · dashboard and register updates</text>
  <path d="M440 243H490" class="normal"/><text x="447" y="228" class="tiny">loads</text>

  <rect x="60" y="350" width="1480" height="615" rx="18" fill="#fff" stroke="#d9e1ec"/>
  <text x="84" y="384" class="laneTitle">NODE / EXPRESS APPLICATION</text>
  <rect x="92" y="416" width="182" height="74" rx="12" fill="#eef1f7" stroke="#d5dce8"/>
  <text x="112" y="447" class="boxTitle">server.js</text><text x="112" y="470" class="small">Express app · mounts routes</text>
  <path d="M960 287V331H182V416" class="normal"/><text x="451" y="324" class="tiny">HTTP /api</text>

  <text x="320" y="416" class="laneTitle">ROUTERS · routes/</text>
  <g filter="url(#shadow)">
    <rect x="320" y="438" width="220" height="78" rx="12" fill="#fff5e9" stroke="#f0d3ac"/>
    <rect x="566" y="438" width="220" height="78" rx="12" fill="#f4f0ff" stroke="#d9cef4"/>
    <rect x="812" y="438" width="220" height="78" rx="12" fill="#f4f0ff" stroke="#d9cef4"/>
    <rect x="1058" y="438" width="220" height="78" rx="12" fill="#f4f0ff" stroke="#d9cef4"/>
  </g>
  <text x="342" y="470" class="boxTitle">orders.js</text><text x="342" y="494" class="small">POST /orders · cancel</text>
  <text x="588" y="470" class="boxTitle">products.js</text><text x="588" y="494" class="small">products · coupons</text>
  <text x="834" y="470" class="boxTitle">customers.js</text><text x="834" y="494" class="small">customers · settle</text>
  <text x="1080" y="470" class="boxTitle">reports.js</text><text x="1080" y="494" class="small">preview · reports · export</text>
  <path d="M274 454H320" class="normal"/><path d="M274 466H566" class="normal"/><path d="M274 478H812" class="normal"/><path d="M274 490H1058" class="normal"/>
  <path d="M430 516V553" class="hot"/><path d="M674 516V553" class="normal"/><path d="M920 516V553" class="normal"/><path d="M1168 516V553" class="normal"/>

  <text x="320" y="548" class="laneTitle">BUSINESS MODULES · lib/</text>
  <g filter="url(#shadow)">
    <rect x="320" y="570" width="220" height="86" rx="12" fill="#fff1ed" stroke="#efb7a9"/>
    <rect x="566" y="570" width="220" height="86" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="812" y="570" width="220" height="86" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="1058" y="570" width="220" height="86" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="320" y="686" width="220" height="78" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="566" y="686" width="220" height="78" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="812" y="686" width="220" height="78" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="1058" y="686" width="220" height="78" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="320" y="792" width="220" height="78" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
    <rect x="566" y="792" width="220" height="78" rx="12" fill="#eef8f5" stroke="#c5e3d9"/>
  </g>
  <text x="342" y="604" class="boxTitle">orders.js</text><text x="342" y="630" class="small">create · get · cancel · list</text>
  <text x="588" y="604" class="boxTitle">inventory.js</text><text x="588" y="630" class="small">find · stock check · reserve</text>
  <text x="834" y="604" class="boxTitle">pricing.js</text><text x="834" y="630" class="small">subtotal · discount · tax totals</text>
  <text x="1080" y="604" class="boxTitle">coupons.js</text><text x="1080" y="630" class="small">normalize · validate · discount</text>
  <text x="342" y="720" class="boxTitle">tax.js</text><text x="342" y="746" class="small">HSN rates · CGST / SGST</text>
  <text x="588" y="720" class="boxTitle">ledger.js</text><text x="588" y="746" class="small">Khata · credit · settlements</text>
  <text x="834" y="720" class="boxTitle">store.js</text><text x="834" y="746" class="small">read · write · audit log</text>
  <text x="1080" y="720" class="boxTitle">reports.js</text><text x="1080" y="746" class="small">dashboard · GST reconciliation</text>
  <text x="342" y="826" class="boxTitle">invoice.js</text><text x="342" y="852" class="small">invoice figures · HTML rendering</text>
  <text x="588" y="826" class="boxTitle">dates.js</text><text x="588" y="852" class="small">today · date normalization</text>

  <rect x="1310" y="570" width="195" height="114" rx="14" fill="#edf4ff" stroke="#c8d9f2"/>
  <text x="1332" y="604" class="boxTitle">config.js</text><text x="1332" y="630" class="small">shop · tax · coupons</text><text x="1332" y="652" class="small">port · inventory defaults</text>
  <rect x="1310" y="748" width="195" height="114" rx="14" fill="#fff8df" stroke="#eadb9f"/>
  <text x="1332" y="782" class="boxTitle">data/db.json</text><text x="1332" y="808" class="small">products · orders · customers</text><text x="1332" y="830" class="small">settlements · audit log</text>
  <path d="M1032 726H1302V805H1310" class="normal"/><text x="1158" y="716" class="tiny">read / write</text>
  <path d="M1278 610H1310" class="dashed"/><path d="M1278 726H1292V650H1310" class="dashed"/>

  <path d="M430 656V675H470V686" class="hot"/><text x="438" y="677" class="tiny" fill="#e4573d">deduct stock</text>
  <path d="M540 612H812" class="hot"/><text x="636" y="600" class="tiny" fill="#e4573d">check stock</text>
  <path d="M1032 612H1058" class="hot"/><text x="1036" y="600" class="tiny" fill="#e4573d">coupon</text>
  <path d="M920 656V675H430V686" class="dashed"/><text x="735" y="674" class="tiny">tax lookup</text>
  <path d="M540 726H566" class="hot"/><text x="540" y="714" class="tiny" fill="#e4573d">Khata (if selected)</text>
  <path d="M430 656V774H920V686" class="hot"/><text x="666" y="768" class="tiny" fill="#e4573d">create order · audit · persist</text>

  <rect x="80" y="900" width="1440" height="42" rx="10" fill="#fff1ed" stroke="#efc1b7"/>
  <line x1="102" y1="921" x2="158" y2="921" stroke="#e4573d" stroke-width="3.2" marker-end="url(#hotArrow)"/>
  <text x="174" y="926" class="small"><tspan font-weight="700" fill="#bd452f">Order placement flow:</tspan> public/js/app.js → routes/orders.js → inventory check → pricing / coupon / tax → optional Khata → stock deduction → lib/orders.js → lib/store.js → data/db.json</text>
  <text x="82" y="990" class="tiny">Grey connectors show app dependencies and data access. Coral connectors highlight the order placement path.</text>
</svg>
